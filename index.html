<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Nova EarBuds</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/main.css" rel="stylesheet">
    <link href="css/grid.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.1/gsap.min.js"></script>
  </head>
  <body>

    <!--Header-->
    <header id="header-section" class="grid-con">
        <h1 class="hidden">Nova Earbuds</h1>

        <div id="mobile-header" class="col-span-full">
          <div id="header-logo">
            <a href="index.html"><img src="images/Nova-Logo.svg" alt="Portfolio-Logo-TB"></a>
          </div>

          <button id="hamburger-menu" aria-label="Open navigation menu">
              <img class="hamburger-icon" src="images/Menu-Icon-Orange.svg" alt="Menu">
          </button>
        </div>

      <!--Navbar/Sidebar-->
      <nav aria-label="Primary Navigation">
          <ul id="nav-bar">
              <li class="nav-item"><a href="index.html">Home</a></li>
              <li class="nav-item"><a href="#">3D Model</a></li>
              <li class="nav-item"><a href="#">Scroll-To</a></li>
              <li class="nav-item"><a href="#">Slider</a></li>
          </ul>

          <ul id="side-bar">
              <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
              <li class="nav-item"><a href="#" class="nav-link">3D-Model</a></li>
              <li class="nav-item"><a href="#" class="nav-link">Scroll-To</a></li>
              <li class="nav-item"><a href="#" class="nav-link">Slider</a></li>
          </ul>
      </nav>
    </header>
    

    <section id="model">
      <h2 class="hidden">3D-View</h2>
      <model-viewer src="model/TEXTURED_Nova-Earbuds.gltf" camera-controls tone-mapping="neutral" shadow-intensity="1" camera-orbit="0deg 75deg 1.63m" field-of-view="30deg">
        
        <button class="Hotspot" id="hs-1" slot="hotspot-1" data-position="0.17933342230798638m 5.045727776967136m -5.642475119600148m" data-normal="1m 1.4900916258489895e-8m 8.730135924262023e-11m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation" id="hotspot-1"></div>
          <p id="letter-b" class="letter">B</p>
        </button>
      
        <button class="Hotspot" id="hs-2" slot="hotspot-2" data-position="0.012522924572604094m 5.1999396886488825m -5.763878243056942m" data-normal="0.9369031657452682m 0.1454511574011386m -0.3178937225350064m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation" id="hotspot-2"></div>
          <p id="letter-d" class="letter">D</p>
        </button>
        
        <button class="Hotspot" id="hs-3" slot="hotspot-3" data-position="0.06387165472328057m 5.051544680708091m -5.717367690533023m" data-normal="-6.603527899298338e-10m 0.037160342413743m -0.9993093159536207m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation" id="hotspot-3"></div>
          <p id="letter-c" class="letter">C</p>
        </button>
        
        <button class="Hotspot" id="hs-4" slot="hotspot-4" data-position="0.05429188879176822m 4.854292395079452m -5.6429233766789055m" data-normal="-1.2822233649488215e-8m -0.374606758513506m -0.9271837878630126m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation" id="hotspot-4"></div> 
          <p id="letter-e" class="letter">E</p>
        </button>
        
        <button class="Hotspot" id="hs-5" slot="hotspot-5" data-position="0.05900646764100561m 5.148798292410435m -5.408753666427334m" data-normal="3.42285417787025e-8m 3.422854295029556e-8m 0.9999999999999989m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation" id="hotspot-5"></div>
          <p id="letter-a" class="letter">A</p>
        </button>

        <div class="progress-bar hide" slot="progress-bar">
            <div class="update-bar"></div>
        </div>
      </model-viewer>

      <section class="grid-con">
        <div class="mobile-features col-span-full"></div>
      </section>

    </section>

    <section id="scroll-animation" class="grid-con">
      <div id="scroll" class="col-span-full">
          <canvas id="explode-view"></canvas> 
      </div>
    </section>

    <section class="grid-con">
      <h2 class="hidden">Nova-Slider</h2>
      <div class="col-span-full">        
          <div id="xray">
              <div id="divisor"></div>
              <input type="range" min="0" max="100" value="50" id="slider">
          </div>    
      </div>
    </section>

    <footer id="footer" class="grid-con">
      <h2 class="hidden">Footer</h2>
      <section id="footer-content" class="col-span-full">
        <div id="footer-logo">
          <a href="index.html"><img src="images/Nova-Logo.svg" alt="Nova Logo"></a>
        </div>
        <h3 id="footer-text">Copyright &copy; Nova. All rights reserved.</h3>
      </section>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.5.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.5.0/ScrollTrigger.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
